name: CKODEX SSDLC (Dagger Engine)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  # Thin GitHub Actions layer dispatching to Dagger Python SDK module from repository root
  lint:
    name: Lint & Format (Ruff via Dagger)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Ruff Lint via Dagger
        uses: dagger/dagger-for-github@v7
        with:
          version: "0.21.8"
          verb: call
          args: -m ./ci lint --source .

  typecheck:
    name: Static Type Analysis (Mypy via Dagger)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Mypy via Dagger
        uses: dagger/dagger-for-github@v7
        with:
          version: "0.21.8"
          verb: call
          args: -m ./ci typecheck --source .

  security:
    name: Security & Vulnerability Audit (Dagger)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Scan Secrets (Gitleaks via Dagger)
        uses: dagger/dagger-for-github@v7
        with:
          version: "0.21.8"
          verb: call
          args: -m ./ci scan-secrets --source .

      - name: Audit CVEs (Grype & Syft via Dagger)
        uses: dagger/dagger-for-github@v7
        with:
          version: "0.21.8"
          verb: call
          args: -m ./ci scan-vulnerabilities --source .

  test:
    name: High-Assurance Unit Tests (Pytest via Dagger)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Pytest Suite via Dagger
        uses: dagger/dagger-for-github@v7
        with:
          version: "0.21.8"
          verb: call
          args: -m ./ci test --source .

  conformance:
    name: Conformance Invariant Evaluation (Dagger)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Evaluate Conformance via Dagger
        uses: dagger/dagger-for-github@v7
        with:
          version: "0.21.8"
          verb: call
          args: -m ./ci conformance --source .

  docs:
    name: Living Documentation Build (Hugo via Dagger)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Hugo Site via Dagger
        uses: dagger/dagger-for-github@v7
        with:
          version: "0.21.8"
          verb: call
          args: -m ./ci build-docs --source .

  package-oci:
    name: OCI Artifact Packaging (Dagger)
    runs-on: ubuntu-latest
    needs: [lint, typecheck, security, test, conformance, docs]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Package OCI Artifact via Dagger
        uses: dagger/dagger-for-github@v7
        with:
          version: "0.21.8"
          verb: call
          args: -m ./ci pack-oci-template --source .
