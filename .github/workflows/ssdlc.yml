name: CKODEX SSDLC Pipeline (Dagger Engine)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  dagger-ssdlc:
    name: Dagger SSDLC High-Assurance CI/CD
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Full SSDLC Pipeline via Dagger
        uses: dagger/dagger-for-github@v7
        with:
          version: "0.21.8"
          verb: call
          args: all --source .
          workdir: ci
