{{ define "main" }}
<section>
  <h1>{{ .Title }}</h1>
  {{ if .Description }}<p style="color: #8b949e; font-size: 1.1rem; margin-bottom: 1.5rem;">{{ .Description }}</p>{{ end }}
  
  <div class="content">
    {{ .Content }}
  </div>

  {{ if .Pages }}
  <h2 style="margin-top: 2rem;">Articles in this section</h2>
  <ul>
    {{ range .Pages }}
    <li><a href="{{ .RelPermalink }}" style="color: var(--accent-blue); font-size: 1.1rem; font-weight: 600;">{{ .Title }}</a> - {{ .Description }}</li>
    {{ end }}
  </ul>
  {{ end }}
</section>
{{ end }}
