{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ckodex-aiops.fullname" . }}-zero-trust
  labels:
    {{- include "ckodex-aiops.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ckodex-aiops.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow incoming traffic on port 8080 from authorized namespaces only
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  {{- toYaml .Values.networkPolicy.allowIngressFromNamespaces | nindent 18 }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.gateway.port }}
  egress:
    # Allow outbound traffic to Vault service and DNS only
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: vault
      ports:
        - protocol: TCP
          port: 8200
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
